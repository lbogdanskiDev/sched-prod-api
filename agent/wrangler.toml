name = "sched-prod-agent"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true

[triggers]
crons = ["* * * * *"]

[vars]
GEMINI_MODEL = "gemini-2.5-pro"
API_SCRIPT = "sched-prod-api-production"
ACCOUNT_ID = "55ea1fc4785b1f8992ee817dec9a563c"

# Text imports: the skill and the repo docs the agent reads.
[[rules]]
type = "Text"
globs = ["**/*.md", "**/*.txt"]
fallthrough = true

[[kv_namespaces]]
binding = "STATE"
id = "REPLACE_ME"

# Secrets (wrangler secret put): GEMINI_API_KEY, CF_API_TOKEN, TRACKER_URL, TRACKER_TOKEN, FEED_URL, LIVE_URL
